services:
  api:
    build: .
    container_name: ds-rag-api
    env_file:
      - .env
    environment:
      DB_FILE: /app/data/chunks.db
      DATA_FILE: /app/ds_content.json
      EMBED_MODEL: all-MiniLM-L6-v2
    volumes:
      - rag_data:/app/data
    command: >
      sh -c "if [ ! -f /app/data/chunks.db ]; then python build_index.py; fi && python rag_api.py"
    ports:
      - "5000:5000"
    restart: unless-stopped

  ui:
    build: .
    container_name: ds-chainlit-ui
    environment:
      RAG_API_URL: http://api:5000/ask
      RAG_API_TIMEOUT: "120"
    command: chainlit run chainlit_app.py --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  rag_data:
